name: NBA news to Telegram

# Бот работает почти круглосуточно: один запуск длится ~5,5 часа (опрос раз в минуту),
# в конце сам запускает следующий. Расписание раз в час — подстраховка, если цепочка оборвалась.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "run — обычная работа; demo — примеры постов в канал; test — тестовое сообщение; check — проверка источников"
        default: run
  push:                       # служебный запуск: режим берётся из файла .github/test-request
    paths: [".github/test-request"]

concurrency:
  group: ${{ (github.event_name == 'push' || (inputs.mode != '' && inputs.mode != 'run')) && 'nba-service' || 'nba-main' }}
  cancel-in-progress: false

permissions:
  contents: write   # служебные отчёты (debug/)
  actions: write    # бот сам запускает следующую смену

env:
  MAIN: ${{ github.event_name != 'push' && (inputs.mode == '' || inputs.mode == 'run') }}

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 358
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
      TRANSLATE_TO: ru
      POST_ON_FIRST_RUN: "0"
      # ключи переводчиков: GEMINI_API_KEY — лучший вариант (бесплатно на aistudio.google.com)
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
      OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
      DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}
      MYMEMORY_EMAIL: ${{ secrets.MYMEMORY_EMAIL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Restore state
        uses: actions/cache/restore@v4
        with:
          path: data
          key: nba-state-${{ github.run_id }}
          restore-keys: nba-state-

      - name: Service mode
        if: env.MAIN != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          MODE="${{ inputs.mode }}"
          [ -z "$MODE" ] && MODE=$(head -1 .github/test-request | awk '{print $1}')
          case "$MODE" in
            demo)  python bot.py --demo ;;
            start) gh workflow run news.yml --ref "${{ github.ref_name }}" -f mode=run ;;
            restart)   # остановить текущую смену (состояние сохранится) и начать новую
              for id in $(gh run list --workflow news.yml --status in_progress --json databaseId,event \
                          -q '.[] | select(.event != "push") | .databaseId'); do gh run cancel "$id"; done
              gh workflow run news.yml --ref "${{ github.ref_name }}" -f mode=run ;;
            check) python bot.py --check ;;
            report) python bot.py --report ;;
            probe)
              PROBE_ONLY="$(sed -n 2p .github/test-request)" python tools/probe.py
              git config user.name "nba-news-bot"; git config user.email "nba-news-bot@users.noreply.github.com"
              git add -f debug && git commit -qm "debug: probe" && git pull -q --rebase origin main && git push -q ;;
            *)     python bot.py --test ;;
          esac

      # пять смен по 65 минут; после каждой состояние сохраняется (на случай сбоя)
      - name: Watch news (1/5)
        if: env.MAIN == 'true'
        run: python bot.py --minutes 65 || true
      - name: Save state (1/5)
        if: env.MAIN == 'true' && always()
        uses: actions/cache/save@v4
        with: { path: data, key: "nba-state-${{ github.run_id }}-${{ github.run_attempt }}-1" }

      - name: Watch news (2/5)
        if: env.MAIN == 'true'
        run: python bot.py --minutes 65 || true
      - name: Save state (2/5)
        if: env.MAIN == 'true' && always()
        uses: actions/cache/save@v4
        with: { path: data, key: "nba-state-${{ github.run_id }}-${{ github.run_attempt }}-2" }

      - name: Watch news (3/5)
        if: env.MAIN == 'true'
        run: python bot.py --minutes 65 || true
      - name: Save state (3/5)
        if: env.MAIN == 'true' && always()
        uses: actions/cache/save@v4
        with: { path: data, key: "nba-state-${{ github.run_id }}-${{ github.run_attempt }}-3" }

      - name: Watch news (4/5)
        if: env.MAIN == 'true'
        run: python bot.py --minutes 65 || true
      - name: Save state (4/5)
        if: env.MAIN == 'true' && always()
        uses: actions/cache/save@v4
        with: { path: data, key: "nba-state-${{ github.run_id }}-${{ github.run_attempt }}-4" }

      - name: Watch news (5/5)
        if: env.MAIN == 'true'
        run: python bot.py --minutes 60 || true
      - name: Save state (5/5)
        if: env.MAIN == 'true' && always()
        uses: actions/cache/save@v4
        with: { path: data, key: "nba-state-${{ github.run_id }}-${{ github.run_attempt }}-5" }

      - name: Start next shift
        if: env.MAIN == 'true' && !cancelled()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run news.yml --ref "${{ github.ref_name }}" -f mode=run
