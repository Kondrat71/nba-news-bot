name: NBA news to Telegram

on:
  schedule:
    - cron: "*/10 * * * *"   # каждые 10 минут запускается сеанс на ~9 минут
  workflow_dispatch:          # кнопка «Run workflow» для ручного запуска
    inputs:
      test:
        description: "Только отправить тестовое сообщение в канал"
        type: boolean
        default: false
  push:                       # изменение этого файла = отправить тестовое сообщение
    paths: [".github/test-request"]

# не запускать два сеанса одновременно: следующий ждёт окончания предыдущего
concurrency:
  group: nba-news
  cancel-in-progress: false

permissions:
  contents: write   # чтобы сохранять data/seen.db (какие новости уже опубликованы)

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Test message
        if: ${{ inputs.test || github.event_name == 'push' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
        run: python bot.py --test

      - name: Poll sources and post news
        if: ${{ !inputs.test && github.event_name != 'push' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          TRANSLATE_TO: ru
          SHOW_ORIGINAL: "1"
          POST_ON_FIRST_RUN: "0"
        # опрос всех источников раз в минуту в течение 9 минут
        run: python bot.py --minutes 9

      - name: Save state
        if: ${{ always() && !inputs.test && github.event_name != 'push' }}
        run: |
          git config user.name "nba-news-bot"
          git config user.email "nba-news-bot@users.noreply.github.com"
          git add data/seen.db
          git diff --cached --quiet || (git commit -m "state: update seen news" && git pull --rebase -X theirs origin main && git push)
